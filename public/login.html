<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Stripe Transactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #1a1f36; --muted: #697386; --border: #e3e8ee;
    --accent: #635bff; --accent-2: #8b5cf6; --accent-soft: #efeeff; --err: #c0123c; --err-soft: #fde8ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --surface: #171b24; --text: #e6e9ef; --muted: #8b93a7; --border: #262c38;
      --accent: #7b74f5; --accent-2: #9b7bff; --accent-soft: #23213d; --err: #ff6b8a; --err-soft: #3a1820;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(circle at 20% 0%, var(--accent-soft), transparent 45%), radial-gradient(circle at 100% 100%, var(--accent-soft), transparent 40%); }
  main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 32px 28px; box-shadow: 0 20px 48px -20px rgba(16, 24, 40, .3); }
  .logo { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: #fff; margin-bottom: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px -6px var(--accent); }
  .logo svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; transition: border-color .15s, box-shadow .15s; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button { width: 100%; margin-top: 22px; font: inherit; font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; border-radius: 10px; padding: 12px; cursor: pointer; box-shadow: 0 6px 16px -8px var(--accent); }
  button:hover { filter: brightness(1.08); }
  .error { background: var(--err-soft); color: var(--err); border-radius: 8px; padding: 10px 12px; margin: 0 0 6px; }
</style>
</head>
<body>
<main>
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to view your Stripe transactions.</p>
  {{ERROR}}
  <form method="post" action="/login">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>

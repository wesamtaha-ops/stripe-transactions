<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Product Transactions</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #1a1f36; --muted: #697386; --border: #e3e8ee;
    --accent: #635bff; --err: #c0123c; --err-soft: #fde8ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --surface: #171b24; --text: #e6e9ef; --muted: #8b93a7; --border: #262c38;
      --accent: #8c86ff; --err: #ff6b8a; --err-soft: #3a1820;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  button { width: 100%; margin-top: 22px; font: inherit; font-size: 16px; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 8px; padding: 11px; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  .error { background: var(--err-soft); color: var(--err); border-radius: 8px; padding: 10px 12px; margin: 0 0 6px; }
</style>
</head>
<body>
<main>
  <h1>Product Transactions</h1>
  <p class="sub">Sign in to view your Stripe dashboard.</p>
  {{ERROR}}
  <form method="post" action="/login">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
